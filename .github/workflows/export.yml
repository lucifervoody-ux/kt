# Выгрузка в Google-таблицу. Запускается кнопкой «Выгрузить данные в таблицу» в приложении.
# Нужны секреты GOOGLE_SERVICE_ACCOUNT и SHEET_ID (Settings → Secrets and variables → Actions).
name: Выгрузка в таблицу

on:
  push:
    branches: [main]
    paths: [.github/workflows/export.yml]
  workflow_dispatch:
    inputs:
      site:
        description: 'Совместимость с приложением. Выгрузка всегда ограничена семью тестовыми сайтами.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # браузер выгрузке не нужен
      - name: Записать результаты в таблицу
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SITE: '27,46,111,134,169,200,219'
        run: node collector/export.mjs --site "$SITE"
