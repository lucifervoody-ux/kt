# Скрипт Конгет. Запускается только вручную: кнопкой «Наличие скрипта Конгет» в приложении
# или на вкладке Actions.
name: Скрипт Конгет

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Совместимость с приложением. Проверяются семь тестовых сайтов.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read # узнать, идёт ли проверка работы

concurrency:
  group: konget
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # максимум GitHub для одного запуска — 6 часов
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Дождаться окончания проверки работы сайтов
        run: node collector/wait-health.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Пока ждали, «Работа сайтов» могла сохранить свежий результат: забираем его.
      - name: Забрать свежий результат проверки работы
        run: git pull --ff-only origin ${{ github.ref_name }} || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Найти скрипт Конгет на сайтах
        env:
          SITE: '27,46,111,134,169,200,219'
          # Список сайтов — из листа «Сайты» Google-таблицы.
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node collector/konget.mjs --site "$SITE"

      # Сохраняем и тогда, когда проверку остановили кнопкой: то, что успели, не пропадёт.
      - name: Сохранить результат в репозиторий
        if: success() || cancelled()
        run: |
          git config user.name "konget-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Скрипт Конгет $(date +%F)"
          # Другая проверка могла сохраниться одновременно: подтягиваем (при конфликте берём свежие данные этого прогона) и пробуем ещё раз.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push && exit 0
            git rebase --abort || true
            sleep $((i * 5))
          done
          exit 1
