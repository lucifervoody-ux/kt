# Общий шаблон сверки УТП для сайтов на движке Perxis (tenet.ru, tank.ru, belgee.ru и дилерские сайты на нём).
# Подходит к любому сайту, у которого нет своего сценария и проверка «Работа сайтов» определила движок Perxis.
# Адреса — от корня сайта. Селекторы через запятую: у разных версий движка классы немного отличаются.
engine: Perxis

# Меню моделей → страница каждой модели: цены всех комплектаций и выгоды.
models:
  list_url: /
  link: .menu-models__left-item-link, a.js-menu-models-link, .js-menu-models-link a, a.menu-models__list-link, a.menu2-models__item-link, a.footer__menu-link[href^="/model/"]
  name: .menu-models__left-item-title, .menu-models__item-title, .menu2-models__item-title
  page:
    min_price: 300000
    price: .web_block_grades__card-content .main-caps, .web_block_packages-single__card-price, .web_block_media-model__text h2, .web_block_grades-new__card-price, .web_block_header-halfscreen__title .h1, .web_block_model_hero__header p
    benefit: .web_block_media-flow-icon__title, .web_block_media-model__text .tooltip__content

# Меню моделей на главной: цена «от» каждой модели (на случай, если на странице модели цены нет).
pages:
  - url: /
    card: .menu-models__left-item, .menu-models__item, .model-range-block__slide, .menu2-models__item
    model: .menu-models__left-item-title, .menu-models__item-title, .model-range-block__name, .menu2-models__item-title
    price: .menu-models__left-item-price, .menu-models__item-price, .model-range-block__price, .menu2-models__item-price
