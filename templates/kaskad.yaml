# Шаблон для сайтов платформы «Каскад» (бета-финанс, дав-авто и др.: в коде стоит --siteUi: kaskad).
# На главной и в списке автомобилей у каждой модели карточка .item: название, цена «от …» и блок выгод.
# Проверено по снимкам главных страниц ID 125, 128, 214.
engine: Каскад

pages:
  - url: /
    card: .item
    model: .item__title
    price: .item__price-container .text-lg-h2
    benefit: .item__benefits-el-text
