# Запасной шаблон для сайтов, у движка которых ещё нет своего шаблона.
# Ищет ссылки на страницы моделей и берёт с них цены «от …» и выгоды по всему тексту страницы.
# Если моделей не нашлось, берёт с главной самую низкую цену и самую большую выгоду по всему сайту.
# Точность ниже, чем у шаблона движка, поэтому такие сайты всегда помечаются «Требует проверки».
engine: '*'
check: true
aggregate:
  min_price: 500000

models:
  list_url: /
  link: a[href*="/models/"], a[href*="/model/"], a[href^="/cars/"]
  max_links: 30
  page:
    title: h1
    price: body
    benefit: body
    min_price: 300000

# Сначала автопоиск карточек моделей на главной (collector/autocards.mjs): находит повторяющиеся
# блоки с ценой и названием без селекторов. Если нашёл хотя бы 2 модели, обход по ссылкам не делаем.
auto:
  url: /
